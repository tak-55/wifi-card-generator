<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wi-Fi カードジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#E9EDF1; --panel:#FFFFFF; --ink:#1C2733; --muted:#5B6878; --line:#CBD3DC; --ui:#2F8FE0;
  --c-base:#14161A; --c-white:#FFFFFF; --c-a1:#C8F25A; --c-a2:#FF5A1F;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark; --bg:#12171D; --panel:#1B222B; --ink:#E6EBF0; --muted:#97A3B1; --line:#2E3946; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6}
main{max-width:1100px;margin:0 auto;padding:32px 20px 48px;display:grid;gap:28px;
  grid-template-columns:minmax(0,390px) minmax(0,1fr);align-items:start}
@media (max-width:880px){main{grid-template-columns:1fr}}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:700}
h2{font-size:1.05rem;margin:4px 0 0}
.lead{margin:0 0 20px;color:var(--muted);font-size:.9rem}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:18px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px;min-width:0}
fieldset+fieldset{border-top:1px solid var(--line);padding-top:16px}
legend{font-weight:700;margin-bottom:6px;float:left;width:100%}
label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
select option{background:var(--panel)}
input.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:1rem}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:2px}
input[type=file]{font-size:.84rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:end}
.row>*{flex:1;min-width:0}
.check{display:flex;gap:8px;align-items:center;color:var(--ink)}
.check input{width:16px;height:16px;accent-color:var(--ui)}
input[type=range]{accent-color:var(--ui);width:100%}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.primary{background:var(--ui);border-color:var(--ui);color:#fff}
button.small{padding:5px 10px;font-size:.84rem}
button:disabled{opacity:.5;cursor:progress}
button:hover:not(:disabled){filter:brightness(1.06)}
:focus-visible{outline:3px solid var(--ui);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;display:block;text-align:center;cursor:pointer;padding:7px 4px;color:var(--ink);font-size:.86rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ui);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--ui);outline-offset:-3px}
.strength,.note{font-size:.8rem;color:var(--muted);margin:0}

.stage{display:grid;gap:16px;justify-items:center}
.wifi-card{width:min(100%,640px);aspect-ratio:150/94;background:var(--c-base);color:var(--c-white);
  border-radius:8% / 12.766%;
  padding:5.5% 6% 8% 6.7%;position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:2cqi 5%;align-items:center;
  container-type:inline-size;box-shadow:0 18px 40px -18px rgba(10,20,35,.55)}
.wifi-card.framed::before{content:"";position:absolute;inset:3.191% 2%;border:2px solid var(--c-a1);pointer-events:none;
  border-radius:6.25% / 10.2%}
/* 左下を中心にした電波の弧（半径 38/52/66 mm、幅 3 mm）。1 mm = 0.6667cqi */
.wifi-card .corner{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 0 100%,
  transparent 0 24.33cqi,var(--c-a1) 24.33cqi 26.33cqi,transparent 26.33cqi 33.67cqi,var(--c-a1) 33.67cqi 35.67cqi,transparent 35.67cqi 43cqi,var(--c-a1) 43cqi 45cqi,transparent 45cqi)}
.card-left{grid-row:2;grid-column:2;display:grid;gap:3cqi;min-width:0;position:relative;z-index:1}
.card-head{grid-row:1;grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:2.6cqi;min-width:0}
.card-head svg{width:7cqi;height:auto;flex:none;color:var(--c-a1)}
.card-head canvas{height:8cqi;width:auto;max-width:30cqi;flex:none}
.card-title{font-size:5.3cqi;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.k{font-size:3cqi;font-weight:700;margin:0;color:var(--c-a1)}
.k.pw{color:var(--c-a2)}
.v{font-size:7cqi;font-weight:700;margin:0;line-height:1.25;overflow-wrap:anywhere}
.v.pwv{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-weight:600;justify-self:start;background:var(--c-a2);color:#fff;padding:.8cqi 2cqi;border-radius:2.6cqi;font-size:4.7cqi;white-space:nowrap}
.card-foot:empty{display:none}
.card-foot{font-size:2.9cqi;font-weight:700;margin-top:1cqi;display:flex;align-items:center;gap:1.4cqi}
.card-foot::before{content:"";width:1.4cqi;height:1.4cqi;border-radius:50%;background:var(--c-a1)}
.qr-wrap{grid-row:2;grid-column:1;align-self:end;display:grid;gap:1.4cqi;justify-items:center;position:relative;z-index:1}
.qr-box{background:var(--c-white);border-radius:8px;padding:2cqi;width:33.33cqi}
.qr-box svg{display:block;width:100%;height:auto}
.qr-cap{font-size:2.6cqi;font-weight:700;background:var(--c-base);padding:.5cqi 1.6cqi;border-radius:1cqi}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.payload{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--muted);max-width:640px;width:100%;overflow-x:auto;white-space:nowrap;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}

.print3d{width:min(100%,640px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px}
.print3d canvas{width:100%;height:auto;border-radius:10px}
#v3{aspect-ratio:16/10;touch-action:none;cursor:grab;background:#E9EDF1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
#status{font-size:.84rem;color:var(--muted);margin:0;min-height:1.3em}
footer{grid-column:1/-1;font-size:.8rem;color:var(--muted);text-align:center}

@media print{
  @page{size:A5 landscape;margin:12mm}
  body{background:#fff}
  main{display:block;padding:0}
  .controls,.actions,.payload,.print3d,footer{display:none!important}
  .wifi-card{width:100%;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main>
  <section class="controls">
    <h1>Wi-Fi カードジェネレーター</h1>
    <p class="lead">パスワード・QRコード・3Dモデルはすべてこのブラウザ内で作られ、どこにも送信されません。</p>

    <form id="f" autocomplete="off" onsubmit="return false">
      <fieldset>
        <legend>ネットワーク</legend>
        <label>SSID<input type="text" id="ssid" spellcheck="false"></label>
        <label>暗号化
          <select id="sec">
            <option value="WPA" selected>WPA2 / WPA3</option>
            <option value="WEP">WEP</option>
            <option value="nopass">なし（オープン）</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="hidden"> ステルスSSID</label>
      </fieldset>

      <fieldset id="pwset">
        <legend>パスワード</legend>
        <div class="seg" role="radiogroup" aria-label="生成方式">
          <label><input type="radio" name="mode" value="words" checked>読みやすい</label>
          <label><input type="radio" name="mode" value="random">ランダム</label>
          <label><input type="radio" name="mode" value="manual">手入力</label>
        </div>
        <label id="lenLabel">長さ: <span id="lenVal">16</span> 文字<input type="range" id="len" min="10" max="32" value="16"></label>
        <label class="check" id="ambWrap"><input type="checkbox" id="noAmb" checked> 紛らわしい文字を除く（0 O 1 l I など）</label>
        <label class="check" id="symWrap"><input type="checkbox" id="sym" checked> 記号を含める</label>
        <div class="row">
          <input type="text" id="pw" class="mono" spellcheck="false" aria-label="パスワード">
          <button type="button" id="regen" class="primary" style="flex:none">生成</button>
        </div>
        <span class="strength" id="strength"></span>
      </fieldset>

      <fieldset>
        <legend>ブランド</legend>
        <label>見出し（社名など）<input type="text" id="title"></label>
        <label>ロゴ画像（単色の透過 SVG/PNG がおすすめ）
          <input type="file" id="logoFile" accept="image/svg+xml,image/png,image/webp,image/jpeg">
        </label>
        <div class="row">
          <label>背景の抜き方
            <select id="logoMode">
              <option value="alpha">透過部分を抜く</option>
              <option value="light">白い背景を抜く</option>
            </select>
          </label>
          <label>ロゴの色
            <select id="logoLayer">
              <option value="white">白</option>
              <option value="a1">アクセント1</option>
              <option value="a2">アクセント2</option>
            </select>
          </label>
        </div>
        <div class="row" style="align-items:center">
          <span class="note" id="logoState"></span>
          <button type="button" class="small" id="logoClear" style="flex:none">ロゴを外す</button>
        </div>
        <div class="row">
          <label>土台<input type="color" id="cBase"></label>
          <label>白<input type="color" id="cWhite"></label>
          <label>アクセント1<input type="color" id="cA1"></label>
          <label>アクセント2<input type="color" id="cA2"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>カード表示</legend>
        <label>下部の一行（空なら非表示）<input type="text" id="foot" placeholder="例: Guest access only"></label>
        <label>ラベル
          <select id="lang">
            <option value="en">英語（NETWORK / PASSWORD）</option>
            <option value="ja">日本語（ネットワーク / パスワード）</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="showPw" checked> カードにパスワードを表示</label>
        <label class="check"><input type="checkbox" id="frame"> 外枠</label>
        <label class="check"><input type="checkbox" id="corner"> 左下の電波アーク</label>
        <label class="check"><input type="checkbox" id="qrLogo"> QRの中央にロゴ（誤り訂正を高くします）</label>
      </fieldset>

      <fieldset>
        <legend>3Dプリント</legend>
        <label>仕上げ
          <select id="finish">
            <option value="flat" selected>フラット（色が面一。AMS などマルチカラー向け）</option>
            <option value="raised">浮き彫り（単色ノズルで途中1回の色替え向け）</option>
          </select>
        </label>
        <div class="row">
          <label>カード幅 (mm)<input type="number" id="cw" min="100" max="220" step="5" value="150"></label>
          <label>板厚 (mm)<input type="number" id="ct" min="2" max="6" step="0.2" value="3"></label>
          <label>色層 (mm)<input type="number" id="ch" min="0.4" max="1.2" step="0.2" value="0.6"></label>
        </div>
        <label>メッシュ解像度
          <select id="res">
            <option value="8" selected>標準（0.125 mm）</option>
            <option value="12">高精細（0.083 mm・ファイル大）</option>
          </select>
        </label>
        <p class="note">文字やロゴの細い線は 0.4 mm ノズルで潰れることがあります。カード幅 150 mm 以上が安定です。</p>
      </fieldset>
      <button type="button" class="small" id="reset" style="justify-self:start">設定を既定に戻す</button>
    </form>
  </section>

  <section class="stage">
    <div class="wifi-card" id="card">
      <span class="corner" id="cCorner" aria-hidden="true"></span>
        <div class="card-head">
          <svg id="cIcon" viewBox="0 0 48 36" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
            <path d="M4 12a28 28 0 0 1 40 0"/><path d="M11 19a18 18 0 0 1 26 0"/><path d="M18 26a8 8 0 0 1 12 0"/>
            <circle cx="24" cy="32" r="2.6" fill="currentColor" stroke="none"/>
          </svg>
          <canvas id="cLogo" hidden></canvas>
          <span class="card-title" id="cTitle"></span>
        </div>
      <div class="card-left">
        <div><p class="k" id="cNetL"></p><p class="v" id="cSsid"></p></div>
        <div id="cPwBlock"><p class="k pw" id="cPwL"></p><p class="v pwv" id="cPw"></p></div>
        <div class="card-foot" id="cFoot"></div>
      </div>
      <div class="qr-wrap">
        <div class="qr-box" id="qr"></div>
        <span class="qr-cap" id="cScan"></span>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="print">紙に印刷</button>
      <button type="button" id="dlSvg">QRをSVGで保存</button>
      <button type="button" id="dlPng">QRをPNGで保存</button>
      <button type="button" id="copyPw">パスワードをコピー</button>
    </div>
    <div class="payload" id="payload" title="QRに埋め込まれる文字列"></div>

    <div class="print3d">
      <h2>3Dプリント用モデル</h2>
      <div class="seg" role="radiogroup" aria-label="3D表示">
        <label><input type="radio" name="v3mode" value="assembled" checked>組み立て</label>
        <label><input type="radio" name="v3mode" value="layout">書き出し形状</label>
      </div>
      <canvas id="v3" aria-label="3Dモデルのプレビュー"></canvas>
      <p class="note" id="v3note">ドラッグで回転、ホイールで拡大・縮小</p>
      <canvas id="pv" aria-label="色層のプレビュー"></canvas>
      <ul class="legend" id="legend"></ul>
      <div class="actions">
        <button type="button" class="primary" id="dl3mf">3MF（マルチカラー）</button>
        <button type="button" id="dlZip">色別STL（ZIP）</button>
        <button type="button" id="dlMono">色替え用STL</button>
        <button type="button" id="dlStand">スタンドSTL</button>
      </div>
      <p id="status" role="status"></p>
      <p class="note" id="howto"></p>
    </div>
  </section>
  <footer>パスワードは保存されません。それ以外の設定はこのブラウザに保存されます。</footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  /* ---------- 設定: 組み込み既定 ← config.js ← ブラウザ保存 ---------- */
  const BUILTIN = { title:"WELCOME", logo:null, logoMode:"alpha", logoLayer:"white", qrLogo:false, ssid:"Guest WiFi", foot:"",
    lang:"en", frame:false, corner:true, colors:{base:"#14161A",white:"#FFFFFF",a1:"#C8F25A",a2:"#FF5A1F"} };
  const CFG = Object.assign({}, BUILTIN, window.WIFI_CARD_CONFIG||{});
  CFG.colors = Object.assign({}, BUILTIN.colors, (window.WIFI_CARD_CONFIG||{}).colors||{});
  const STORE_KEY = "wifi-card-settings-v1";
  const FIELDS = { text:["ssid","title","foot"], select:["sec","lang","logoMode","logoLayer","finish","res"],
    check:["hidden","showPw","frame","corner","qrLogo"], num:["cw","ct","ch"], color:{cBase:"base",cWhite:"white",cA1:"a1",cA2:"a2"} };
  const store = {
    get(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); }catch{ return {}; } },
    set(v){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(v)); return true; }catch{ return false; } },
    clear(){ try{ localStorage.removeItem(STORE_KEY); }catch{} }
  };
  let logoImg=null, logoSrc=null, logoFromUpload=false, logoCleared=false;

  function applySettings(s){
    const v = Object.assign({}, CFG, s); v.colors = Object.assign({}, CFG.colors, s.colors||{});
    for(const id of FIELDS.text) $(id).value = v[id] ?? "";
    for(const id of ["lang","logoMode","logoLayer"]) $(id).value = v[id];
    for(const id of ["sec","finish","res"]) if(v[id]!=null) $(id).value = v[id];
    for(const id of ["hidden","frame","corner","qrLogo"]) $(id).checked = !!v[id];
    $("showPw").checked = v.showPw ?? true;
    for(const id of FIELDS.num) if(v[id]!=null) $(id).value = v[id];
    for(const [id,key] of Object.entries(FIELDS.color)) $(id).value = v.colors[key];
    logoFromUpload = !!s.logoData; logoCleared = s.logo===null && !s.logoData;
    return s.logoData || v.logo || null;
  }
  let saveTimer=0;
  function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
    const s={colors:{}};
    for(const id of [...FIELDS.text,...FIELDS.select,...FIELDS.num]) s[id]=$(id).value;
    for(const id of FIELDS.check) s[id]=$(id).checked;
    for(const [id,key] of Object.entries(FIELDS.color)) s.colors[key]=$(id).value;
    if(logoFromUpload && logoSrc) s.logoData=logoSrc;
    if(logoCleared) s.logo=null;
    if(!store.set(s) && s.logoData){ delete s.logoData; store.set(s); }
  },300); }

  function loadLogo(src){
    logoImg=null; logoSrc=null;
    if(!src){ $("logoState").textContent="ロゴなし"; render(); return; }
    const img=new Image();
    img.onload=()=>{ logoImg=img; logoSrc=src; $("logoState").textContent = logoFromUpload?"読み込んだロゴを使用中":"サイト既定のロゴを使用中"; render(); };
    img.onerror=()=>{ $("logoState").textContent="ロゴを読み込めませんでした"; render(); };
    img.src=src;
  }

  /* ---------- パスワード生成 ---------- */
  const WORDS=["Apple","Breeze","Cedar","Delta","Ember","Falcon","Garnet","Harbor","Iris","Jasper","Kite","Lumen","Maple","Nova",
    "Orbit","Pebble","Quartz","River","Summit","Tide","Umber","Violet","Willow","Yonder","Zephyr","Amber","Birch","Cobalt","Dune",
    "Fjord","Grove","Haze","Indigo","Juniper","Koi","Lotus","Meadow","Nimbus","Opal","Prism","Raven","Sable","Topaz","Vapor",
    "Wren","Aspen","Bloom","Comet","Drift","Echo","Flint","Glade","Heron","Ivory"];
  const UPPER="ABCDEFGHIJKLMNOPQRSTUVWXYZ",LOWER="abcdefghijklmnopqrstuvwxyz",DIGIT="0123456789",SYMS="!#%+-=?@_",AMB=/[0O1lIo]/g;
  function randInt(n){const lim=Math.floor(0x100000000/n)*n,b=new Uint32Array(1);do{crypto.getRandomValues(b);}while(b[0]>=lim);return b[0]%n;}
  const pick=s=>s[randInt(s.length)];
  const genWords=()=>{const sep=pick("-._");return [pick(WORDS),pick(WORDS),pick(WORDS)].join(sep)+sep+(randInt(9000)+1000)+($("sym").checked?pick("!#%?"):"");};
  function genRandom(len){
    const amb=$("noAmb").checked,clean=s=>amb?s.replace(AMB,""):s;
    const sets=[clean(UPPER),clean(LOWER),clean(DIGIT)];if($("sym").checked)sets.push(SYMS);
    const all=sets.join(""),out=sets.map(pick);while(out.length<len)out.push(pick(all));
    for(let i=out.length-1;i>0;i--){const j=randInt(i+1);[out[i],out[j]]=[out[j],out[i]];}
    return out.join("");
  }
  function entropyBits(mode,pw){
    if(mode==="words")return Math.round(3*Math.log2(WORDS.length)+Math.log2(3)+Math.log2(9000)+($("sym").checked?2:0));
    let pool=0;if(/[a-z]/.test(pw))pool+=26;if(/[A-Z]/.test(pw))pool+=26;if(/[0-9]/.test(pw))pool+=10;if(/[^A-Za-z0-9]/.test(pw))pool+=10;
    return Math.round(pw.length*Math.log2(Math.max(pool,1)));
  }
  const mode=()=>document.querySelector('input[name=mode]:checked').value;
  function regen(){const m=mode();if(m==="words")$("pw").value=genWords();else if(m==="random")$("pw").value=genRandom(+$("len").value);render();}

  /* ---------- QR ---------- */
  const esc=s=>s.replace(/([\\;,:"])/g,"\\$1");
  function payload(){
    const sec=$("sec").value;let p="WIFI:T:"+sec+";S:"+esc($("ssid").value)+";";
    if(sec!=="nopass")p+="P:"+esc($("pw").value)+";";
    if($("hidden").checked)p+="H:true;";
    return p+";";
  }
  let lastQr=null;
  function buildQr(text){
    if(typeof qrcode==="undefined")return null;
    if(qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs["UTF-8"])qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
    const qr=qrcode(0,$("qrLogo").checked?"H":"M");qr.addData(text,"Byte");qr.make();return qr;
  }
  // 中央ロゴ用の空き領域（モジュール単位, 奇数）。誤り訂正Hで読めるよう一辺は全体の約27%
  function qrClear(n){
    if(!$("qrLogo").checked)return null;
    let k=Math.round(n*.27);if(k%2===0)k++;const a=(n-k)/2;return {a,b:a+k};
  }
  function qrDark(qr,r,c){
    const z=qrClear(qr.getModuleCount());
    return qr.isDark(r,c)&&!(z&&r>=z.a&&r<z.b&&c>=z.a&&c<z.b);
  }
  // 中央に置く黒一色の図柄（ロゴ。なければ Wi-Fi アイコン）。px 四方のキャンバス
  function qrMark(px){
    const c=document.createElement("canvas");c.width=c.height=px;const g=c.getContext("2d");
    if(logoImg){
      const asp=logoAspect(),lw=asp>=1?px:Math.round(px*asp),lh=asp>=1?Math.round(px/asp):px;
      g.drawImage(maskToCanvas(logoMask(lw,lh),lw,lh,"#000000"),Math.round((px-lw)/2),Math.round((px-lh)/2));
    }else{
      g.strokeStyle=g.fillStyle="#000";g.lineWidth=px*.08;g.lineCap="round";
      for(const r of [.14,.28,.42]){g.beginPath();g.arc(px/2,px*.72,px*r,-Math.PI*.75,-Math.PI*.25);g.stroke();}
      g.beginPath();g.arc(px/2,px*.72,px*.06,0,Math.PI*2);g.fill();

  }
  function qrSvg(qr,margin=2,bg="#fff"){
    const n=qr.getModuleCount(),size=n+margin*2,z=qrClear(n);let d="";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qrDark(qr,r,c))d+=`M${c+margin} ${r+margin}h1v1h-1z`;
    const k=z?z.b-z.a:0,s=k*.84,o=margin+z?.a+(k-s)/2;
    const mark=z?`<image x="${o}" y="${o}" width="${s}" height="${s}" href="${qrMark(256).toDataURL()}"/>`:"";
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="${bg}"/><path d="${d}" fill="#000"/>${mark}</svg>`;
  }

  /* ---------- ロゴのマスク化 ---------- */
  const logoAspect=()=>logoImg?((logoImg.naturalWidth||300)/(logoImg.naturalHeight||100)):1;
  function logoMask(w,h){
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
    g.drawImage(logoImg,0,0,w,h);const d=g.getImageData(0,0,w,h).data,m=new Uint8Array(w*h),light=$("logoMode").value==="light";
    for(let i=0;i<w*h;i++){const a=d[i*4+3];if(a<128)continue;
      if(light){const l=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];if(l>=160)continue;}m[i]=1;}
    return m;
  }
  function maskToCanvas(m,w,h,hex){
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d"),img=g.createImageData(w,h);
    const r=parseInt(hex.substr(1,2),16),gg=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
    for(let i=0;i<w*h;i++)if(m[i]){img.data[i*4]=r;img.data[i*4+1]=gg;img.data[i*4+2]=b;img.data[i*4+3]=255;}
    g.putImageData(img,0,0);return c;
  }

  /* ---------- 画面のカード ---------- */
  const LBL={en:{net:"NETWORK",pw:"PASSWORD",scan:"SCAN TO CONNECT"},ja:{net:"ネットワーク",pw:"パスワード",scan:"カメラで読み取って接続"}};
  const showPwOn=()=>$("showPw").checked&&$("sec").value!=="nopass";
  const colors=()=>({base:$("cBase").value,white:$("cWhite").value,a1:$("cA1").value,a2:$("cA2").value});

  function render(){

    const pw=$("pw").value;

    $("strength").textContent=sec==="nopass"?"":(warn||`推定強度: 約 ${entropyBits(m,pw)} bit`);
    $("cTitle").textContent=$("title").value;
    $("cSsid").textContent=$("ssid").value;

    $("cNetL").textContent=L.net;$("cPwL").textContent=L.pw;$("cScan").textContent=L.scan;

    if(logoImg){
      const h=160,w=Math.max(1,Math.round(h*Math.min(logoAspect(),3.75)));

    $("legend").innerHTML=LAYERS.map(c=>`<li><span class="sw" style="background:${C[c.ckey]}"></span>フィラメント${c.fil}: ${c.name}</li>`).join("");

  /* ---------- 3D: ラスタライズ（mm 座標・幅150基準） ---------- */
  const SANS='"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",sans-serif',MONO='"IBM Plex Mono",Menlo,Consolas,monospace';
  const LAYERS=[{key:"plate",ckey:"base",name:"土台",fil:1},{key:"white",ckey:"white",name:"白（文字・QR）",fil:2},
    {key:"a1",ckey:"a1",name:"アクセント1",fil:3},{key:"a2",ckey:"a2",name:"アクセント2",fil:4}];

  function opts(){
    const num=(id,lo,hi,d)=>{const v=parseFloat($(id).value);return isFinite(v)?Math.min(hi,Math.max(lo,v)):d;};
    return {W:num("cw",100,220,150),T:num("ct",2,6,3),h:num("ch",0.4,1.2,0.6),finish:$("finish").value,res:+$("res").value};
  }
  async function loadFonts(){
    const txt=[$("title").value,$("ssid").value,$("foot").value,LBL.ja.net,LBL.ja.pw,LBL.ja.scan,LBL.en.scan].join("");
    try{await Promise.all([document.fonts.load(`700 40px ${SANS}`,txt),document.fonts.load(`600 40px ${MONO}`,$("pw").value||"A")]);}catch(e){}
  }

  async function rasterize(W,res){
    await loadFonts();
    const k=W/150,H=W*94/150,w=Math.round(W*res),h=Math.round(H*res),S=v=>v*k*res;
    const layer=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
      g.fillStyle=g.strokeStyle="#fff";g.lineJoin=g.lineCap="round";g.textBaseline="alphabetic";return g;};
    // 角ごとに半径を変えた角丸矩形。radii=[左上,右上,右下,左下]
    const rrc=(g,x,y,ww,hh,[a,b,c,d])=>{g.beginPath();g.moveTo(x+a,y);g.arcTo(x+ww,y,x+ww,y+hh,b);g.arcTo(x+ww,y+hh,x,y+hh,c);g.arcTo(x,y+hh,x,y,d);g.arcTo(x,y,x+ww,y,a);g.closePath();};
    const rr=(g,x,y,ww,hh,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+ww,y,x+ww,y+hh,r);g.arcTo(x+ww,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+ww,y,r);g.closePath();};
    const text=(g,s,x,y,size,weight,fam,maxW,align="left")=>{
      if(!s||maxW<=0)return;let px=S(size);g.font=`${weight} ${px}px ${fam}`;
      const mw=g.measureText(s).width;if(mw>S(maxW)){px*=S(maxW)/mw;g.font=`${weight} ${px}px ${fam}`;}
      g.textAlign=align;g.fillText(s,S(x),S(y));
    };
    const L=LBL[$("lang").value],corner=$("corner").checked;
    const G={plate:layer(),white:layer(),a1:layer(),a2:layer()};

    rrc(G.plate,0,0,w,h,[S(12),S(12),S(12),S(12)]);G.plate.fill();
    // 左下を中心にした電波の弧。キャプション用に弧を切り欠く
    if(corner){const g=G.a1;g.lineWidth=S(3);g.lineCap="butt";
      for(const r of [38,52,66]){g.beginPath();g.arc(0,S(94),S(r),-Math.PI/2,0);g.stroke();}
      g.globalCompositeOperation="destination-out";g.fillRect(S(10),S(73.5),S(50),S(8.5));g.globalCompositeOperation="source-over";g.lineCap="round";}
    if($("frame").checked){G.a1.lineWidth=S(1.2);rrc(G.a1,S(3),S(3),S(144),S(88),[S(9),S(9),S(9),S(9)]);G.a1.stroke();}

    // 見出し（ロゴ + タイトル）はカード全体の中央（x=75 mm）に置く
    const T=$("title").value,asp=logoImg?logoAspect():1,lw=logoImg?Math.min(10*asp,45):0,gap=logoImg?4:0,avail=126-lw-gap;
    G.white.font=`700 ${S(8)}px ${SANS}`;
    const tw=T?Math.min(G.white.measureText(T).width/S(1),Math.max(avail,0)):0,x0=75-(lw+gap+tw)/2;
    if(logoImg){
      const lh=lw/asp,pw=Math.max(1,Math.round(S(lw))),ph=Math.max(1,Math.round(S(lh)));
      G[$("logoLayer").value].drawImage(maskToCanvas(logoMask(pw,ph),pw,ph,"#ffffff"),Math.round(S(x0)),Math.round(S(13-lh/2)));
    }
    text(G.white,T,x0+lw+gap,16,8,700,SANS,tw);

    text(G.a1,L.net,70,33,4.6,700,SANS,68);
    text(G.white,$("ssid").value,70,45.5,10.5,700,SANS,68);
    if(showPwOn()){
      text(G.a2,L.pw,70,56,4.6,700,SANS,68);
      rrc(G.a2,S(67),S(58),S(72),S(13.5),[S(4),S(4),S(4),S(4)]);G.a2.fill();
      text(G.white,$("pw").value,70,67.5,7,600,MONO,66);
    }
    if($("foot").value){G.a1.beginPath();G.a1.arc(S(71.6),S(78.8),S(1.3),0,Math.PI*2);G.a1.fill();text(G.white,$("foot").value,75,80.2,4.4,700,SANS,62);}
    text(G.white,L.scan,35,79.5,3.6,700,SANS,46,"center");

    let moduleMm=0;
    const px=Math.round(S(10)),py=Math.round(S(22)),P=Math.round(S(50));
    rr(G.white,px,py,P,P,S(2));G.white.fill();
    G.a1.globalCompositeOperation="destination-out";rr(G.a1,px,py,P,P,S(2));G.a1.fill();G.a1.globalCompositeOperation="source-over";
    if(lastQr){

      const z=qrClear(n);
      if(z){const k=(z.b-z.a)*m,sz=Math.round(k*.84),o=Math.round((k-sz)/2);G.white.drawImage(qrMark(sz),px+off+z.a*m+o,py+off+z.a*m+o);}

    }

    const toMask=g=>{const d=g.getImageData(0,0,w,h).data,mk=new Uint8Array(w*h);for(let i=0;i<w*h;i++)mk[i]=d[i*4+3]>127?1:0;return mk;};
    const M={plate:toMask(G.plate),white:toMask(G.white),a1:toMask(G.a1),a2:toMask(G.a2)};
    for(let i=0;i<w*h;i++){
      if(!M.plate[i]){M.white[i]=M.a1[i]=M.a2[i]=0;continue;}
      if(M.white[i]){M.a1[i]=M.a2[i]=0;}else if(M.a1[i])M.a2[i]=0;

  }

  /* ---------- 3D プレビュー ---------- */
  let pvTimer=0;
  function schedulePreview(){clearTimeout(pvTimer);pvTimer=setTimeout(drawPreview,200);}
  async function drawPreview(){
    const o=opts(),R=await rasterize(o.W,4),cv=$("pv"),C=colors();
    cv.width=R.w;cv.height=R.h;
    const g=cv.getContext("2d"),img=g.createImageData(R.w,R.h),rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
    const col={plate:rgb(C.base),white:rgb(C.white),a1:rgb(C.a1),a2:rgb(C.a2)};
    for(let i=0;i<R.w*R.h;i++){
      const key=R.M.white[i]?"white":R.M.a1[i]?"a1":R.M.a2[i]?"a2":R.M.plate[i]?"plate":null;
      if(key){const c=col[key];img.data[i*4]=c[0];img.data[i*4+1]=c[1];img.data[i*4+2]=c[2];img.data[i*4+3]=255;}
    }
    g.putImageData(img,0,0);
    const total=o.finish==="flat"?o.T:o.T+o.h;
    let msg=`${o.W.toFixed(0)} × ${R.H.toFixed(1)} mm、厚さ ${total.toFixed(1)} mm。`;
    if(R.moduleMm&&R.moduleMm<1.0)msg+=` QRのセルが ${R.moduleMm.toFixed(2)} mm と小さめです。カード幅を広げると読み取りが安定します。`;
    else if(R.moduleMm)msg+=` QRのセルは約 ${R.moduleMm.toFixed(2)} mm。`;
    $("status").textContent=msg;
    V3.card=await cardParts({...o,res:3},o.finish);V3.stand=standPart({...o,res:6},true)[0];V3.T=o.finish==="flat"?o.T:o.T+o.h;
    v3scene();
    $("howto").textContent=o.finish==="flat"
      ?"フラット: 色は上面の色層だけに入ります。3MF をそのまま開くか、色別STLを同時に読み込んで「1つのオブジェクトの複数パーツ」として扱い、各パーツにフィラメントを割り当ててください。"
      :`浮き彫り: 「色替え用STL」を使い、高さ ${o.T.toFixed(2)} mm でフィラメント交換（一時停止）を入れると、土台と、文字・QR・ロゴの2色になります。マルチカラー機なら3MF/色別STLで4色にできます。`;
  }

  /* ---------- メッシュ生成（ハイトフィールド → 三角形） ---------- */
  function meshHF(w,h,res,top,zb,xf){
    const verts=[],tris=[],map=new Map(),Y=j=>(h-j)/res;
    const vtx=(i,j,z)=>{const key=i+","+j+","+z;let id=map.get(key);
      if(id===undefined){id=verts.length/3;const p=xf?xf(i/res,Y(j),z):[i/res,Y(j),z];verts.push(p[0],p[1],p[2]);map.set(key,id);}return id;};
    const quad=(a,b,c,d)=>tris.push(a,b,c,a,c,d);
    const Hh=(i,j)=>(i<0||j<0||i>=w||j>=h)?zb:(top[j*w+i]>0?top[j*w+i]:zb);
    function rects(val,emit){
      let active=new Map();
      for(let j=0;j<=h;j++){
        const next=new Map();
        if(j<h){let i=0;while(i<w){const v=val(j*w+i);if(!v){i++;continue;}const a=i;while(i<w&&val(j*w+i)===v)i++;
          const key=a+","+i+","+v,prev=active.get(key);
          if(prev){next.set(key,prev);active.delete(key);}else next.set(key,{a,b:i,v,j0:j});}}
        for(const r of active.values())emit(r.a,r.b,r.v,r.j0,j);
        active=next;
      }
    }
    rects(p=>top[p],(a,b,t,j0,j1)=>quad(vtx(a,j1,t),vtx(b,j1,t),vtx(b,j0,t),vtx(a,j0,t)));
    rects(p=>top[p]>0?1:0,(a,b,_,j0,j1)=>quad(vtx(a,j0,zb),vtx(b,j0,zb),vtx(b,j1,zb),vtx(a,j1,zb)));
    for(let j=0;j<=h;j++){let i=0;while(i<w){const ta=Hh(i,j-1),tb=Hh(i,j);if(ta===tb){i++;continue;}
      const a=i;while(i<w&&Hh(i,j-1)===ta&&Hh(i,j)===tb)i++;const lo=Math.min(ta,tb),hi=Math.max(ta,tb);
      if(tb>ta)quad(vtx(i,j,lo),vtx(a,j,lo),vtx(a,j,hi),vtx(i,j,hi));else quad(vtx(a,j,lo),vtx(i,j,lo),vtx(i,j,hi),vtx(a,j,hi));}}
    for(let i=0;i<=w;i++){let j=0;while(j<h){const tl=Hh(i-1,j),tr=Hh(i,j);if(tl===tr){j++;continue;}
      const a=j;while(j<h&&Hh(i-1,j)===tl&&Hh(i,j)===tr)j++;const lo=Math.min(tl,tr),hi=Math.max(tl,tr);
      if(tl>tr)quad(vtx(i,j,lo),vtx(i,a,lo),vtx(i,a,hi),vtx(i,j,hi));else quad(vtx(i,a,lo),vtx(i,j,lo),vtx(i,j,hi),vtx(i,a,hi));}}
    return {verts,tris};
  }

  async function cardParts(o,finish){
    const R=await rasterize(o.W,o.res),n=R.w*R.h,T=+o.T.toFixed(3),hc=+o.h.toFixed(3),parts=[];
    const colorAt=i=>R.M.white[i]||R.M.a1[i]||R.M.a2[i];
    const zc0=+(finish==="flat"?T-hc:T).toFixed(3),zc1=+(finish==="flat"?T:T+hc).toFixed(3);
    const plateTop=new Float32Array(n);
    for(let i=0;i<n;i++)if(R.M.plate[i])plateTop[i]=(finish==="flat"&&colorAt(i))?zc0:T;
    parts.push({...LAYERS[0],...meshHF(R.w,R.h,R.res,plateTop,0)});
    for(const c of LAYERS.slice(1)){
      const t=new Float32Array(n);let any=false;
      for(let i=0;i<n;i++)if(R.M[c.key][i]){t[i]=zc1;any=true;}
      if(any)parts.push({...c,...meshHF(R.w,R.h,R.res,t,zc0)});
    }
    return parts;
  }

  /* ---------- 3D ビューア（WebGL・依存なし。ドラッグで回転、ホイールで拡大縮小） ---------- */
  const V3={yaw:-0.5,pitch:0.9,zoom:1,meshes:[],c:[0,0,0],r:1,gl:null,prog:null};
  const v3sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],v3cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
    v3dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],v3norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
  function mat4mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let t=0;for(let k=0;k<4;k++)t+=a[k*4+r]*b[c*4+k];o[c*4+r]=t;}return o;}
  function v3init(){
    const cv=$("v3"),gl=cv.getContext("webgl");if(!gl){cv.hidden=true;return;}
    const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);return o;},pr=gl.createProgram();
    gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec3 a;attribute vec3 n;uniform mat4 m;uniform mat3 r;varying float l;void main(){gl_Position=m*vec4(a,1.);l=.4+.6*max(dot(normalize(r*n),normalize(vec3(.3,.5,.8))),0.);}"));
    gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,"precision mediump float;uniform vec3 c;varying float l;void main(){gl_FragColor=vec4(c*l,1.);}"));
    gl.linkProgram(pr);gl.useProgram(pr);gl.enable(gl.DEPTH_TEST);V3.gl=gl;V3.prog=pr;
    let drag=null;
    cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing";};
    cv.onpointerup=()=>{drag=null;cv.style.cursor="grab";};
    cv.onpointermove=e=>{if(!drag)return;V3.yaw-=(e.clientX-drag[0])*.01;V3.pitch=Math.min(1.55,Math.max(.05,V3.pitch+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];v3draw();};
    cv.addEventListener("wheel",e=>{e.preventDefault();V3.zoom=Math.min(3,Math.max(.3,V3.zoom*Math.exp(e.deltaY*.001)));v3draw();},{passive:false});
  }
  // 組み立て: カードをスタンド2個の溝に立てる / 書き出し形状: 3MF・STLで出力されるカードとスタンドをそのまま並べる
  function v3scene(){
    if(!V3.card)return;
    const tr=(p,f)=>{const v=[];for(let i=0;i<p.verts.length;i+=3)v.push(...f(p.verts[i],p.verts[i+1],p.verts[i+2]));return {...p,verts:v};};
    const asm=document.querySelector('input[name=v3mode]:checked').value==="assembled",st=V3.stand,xs=asm?[22,78]:[20,90];
    const {ub,vb,th}=STAND,sn=Math.sin(th),cs=Math.cos(th),
      card=asm?V3.card.map(p=>tr(p,(x,y,z)=>{const n=V3.T/2-z;return [x,ub+y*sn+n*cs,vb+y*cs-n*sn];})):V3.card;
    const clips=xs.map(x=>tr(st,(a,b,c)=>[a+x,asm?b:b-STAND.D-8,c]));
    $("v3note").textContent=(asm?"組み立て: カードをスタンド2個の溝に差した状態。":"書き出し形状: 3MF/STL のカードと、スタンドSTL（2個）をそのまま並べています。")+"ドラッグで回転、ホイールで拡大・縮小";
    v3set(card.concat(clips),colors());
  }
  function v3set(parts,C){
    const gl=V3.gl;if(!gl)return;
    const lo=[1e9,1e9,1e9],hi=[-1e9,-1e9,-1e9];
    V3.meshes=parts.map(p=>{
      const n=p.tris.length,pos=new Float32Array(n*3),nor=new Float32Array(n*3),V=p.verts;
      for(let i=0;i<n;i+=3){
        const ids=[p.tris[i]*3,p.tris[i+1]*3,p.tris[i+2]*3],P=ids.map(j=>[V[j],V[j+1],V[j+2]]);
        const nm=v3norm(v3cross(v3sub(P[1],P[0]),v3sub(P[2],P[0])));
        for(let k=0;k<3;k++)for(let d=0;d<3;d++){pos[(i+k)*3+d]=P[k][d];nor[(i+k)*3+d]=nm[d];lo[d]=Math.min(lo[d],P[k][d]);hi[d]=Math.max(hi[d],P[k][d]);}
      }
      const buf=a=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,a,gl.STATIC_DRAW);return b;};
      const h=C[p.ckey];return {pos:buf(pos),nor:buf(nor),n,col:[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255)};
    });
    V3.c=lo.map((v,d)=>(v+hi[d])/2);V3.r=Math.hypot(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2])/2||1;
    v3draw();
  }
  function v3draw(){
    const gl=V3.gl,cv=$("v3");if(!gl)return;
    const w=Math.round(cv.clientWidth*(devicePixelRatio||1)),h=Math.round(cv.clientHeight*(devicePixelRatio||1));
    if(!w||!h)return;
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
    gl.viewport(0,0,w,h);gl.clearColor(.914,.929,.945,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const d=V3.r*3.1*V3.zoom,cp=Math.cos(V3.pitch),c=V3.c,eye=[c[0]+d*cp*Math.sin(V3.yaw),c[1]-d*cp*Math.cos(V3.yaw),c[2]+d*Math.sin(V3.pitch)];
    const f=v3norm(v3sub(c,eye)),s=v3norm(v3cross(f,[0,0,1])),u=v3cross(s,f);
    const view=[s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-v3dot(s,eye),-v3dot(u,eye),v3dot(f,eye),1];
    const N=V3.r*.1,F=V3.r*20,k=1/Math.tan(.31),a=w/h;
    const proj=[k/a,0,0,0,0,k,0,0,0,0,(F+N)/(N-F),-1,0,0,2*F*N/(N-F),0];
    gl.uniformMatrix4fv(gl.getUniformLocation(V3.prog,"m"),false,mat4mul(proj,view));
    gl.uniformMatrix3fv(gl.getUniformLocation(V3.prog,"r"),false,[view[0],view[1],view[2],view[4],view[5],view[6],view[8],view[9],view[10]]);
    const la=gl.getAttribLocation(V3.prog,"a"),ln=gl.getAttribLocation(V3.prog,"n");
    for(const m of V3.meshes){
      gl.uniform3fv(gl.getUniformLocation(V3.prog,"c"),m.col);
      gl.bindBuffer(gl.ARRAY_BUFFER,m.pos);gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,3,gl.FLOAT,false,0,0);
      gl.bindBuffer(gl.ARRAY_BUFFER,m.nor);gl.enableVertexAttribArray(ln);gl.vertexAttribPointer(ln,3,gl.FLOAT,false,0,0);
      gl.drawArrays(gl.TRIANGLES,0,m.n);
    }
  }
  v3init();addEventListener("resize",v3draw);
  document.querySelectorAll("input[name=v3mode]").forEach(e=>e.onchange=v3scene);

  // スタンド断面（u=奥行, v=高さ）。前が低く後ろが高いスロープに、後ろへ th だけ傾けた溝を切る。これを Lx だけ押し出す
  const STAND={D:30,Hs:16,vb:4,ub:14,th:10*Math.PI/180,Lx:40};
  function standPart(o,single){
    const {D,Hs,vb,ub,th,Lx}=STAND,thick=(o.finish==="flat"?o.T:o.T+o.h)+0.4,res=o.res;
    const w=Math.round(D*res),h=Math.round(Hs*res),top=new Float32Array(w*h),sn=Math.sin(th),cs=Math.cos(th);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){
      const u=(i+.5)/res,v=(h-j-.5)/res,vt=Hs-12*((D-u)/D)**2;
      const flare=Math.max(0,v-(vt-2.5))*.35,slot=v>vb&&Math.abs((u-ub)*cs-(v-vb)*sn)<thick/2+flare;
      if(v<vt&&!slot)top[j*w+i]=Lx;
    }
    const a=meshHF(w,h,res,top,0,(u,v,z)=>[z,u,v]),b=meshHF(w,h,res,top,0,(u,v,z)=>[z,u+D+6,v]),off=a.verts.length/3;
    if(single)return [{key:"stand",ckey:"base",fil:1,...a}];
    return [{key:"stand",ckey:"base",fil:1,verts:a.verts.concat(b.verts),tris:a.tris.concat(b.tris.map(t=>t+off))}];
  }

  /* ---------- 書き出し ---------- */
  function stl(parts){
    let nt=0;for(const p of parts)nt+=p.tris.length/3;
    const buf=new ArrayBuffer(84+50*nt),dv=new DataView(buf),hdr="wifi-card generator";
    for(let i=0;i<hdr.length;i++)dv.setUint8(i,hdr.charCodeAt(i));
    dv.setUint32(80,nt,true);let o=84;
    for(const p of parts){const V=p.verts,Tr=p.tris;
      for(let t=0;t<Tr.length;t+=3){
        const a=Tr[t]*3,b=Tr[t+1]*3,c=Tr[t+2]*3;
        const ux=V[b]-V[a],uy=V[b+1]-V[a+1],uz=V[b+2]-V[a+2],vx=V[c]-V[a],vy=V[c+1]-V[a+1],vz=V[c+2]-V[a+2];
        const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,l=Math.hypot(nx,ny,nz)||1;
        dv.setFloat32(o,nx/l,true);dv.setFloat32(o+4,ny/l,true);dv.setFloat32(o+8,nz/l,true);o+=12;
        for(const k of [a,b,c]){dv.setFloat32(o,V[k],true);dv.setFloat32(o+4,V[k+1],true);dv.setFloat32(o+8,V[k+2],true);o+=12;}
        o+=2;
      }}
    return new Uint8Array(buf);
  }
  function model3mf(parts){
    const f=n=>+n.toFixed(4),vs=[],ts=[],vols=[];let vo=0,to=0;
    for(const p of parts){
      for(let i=0;i<p.verts.length;i+=3)vs.push(`<vertex x="${f(p.verts[i])}" y="${f(p.verts[i+1])}" z="${f(p.verts[i+2])}"/>`);
      for(let i=0;i<p.tris.length;i+=3)ts.push(`<triangle v1="${p.tris[i]+vo}" v2="${p.tris[i+1]+vo}" v3="${p.tris[i+2]+vo}"/>`);
      const nt=p.tris.length/3;vols.push({first:to,last:to+nt-1,name:p.key,fil:p.fil});vo+=p.verts.length/3;to+=nt;
    }
    const te=new TextEncoder();
    const model=`<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02" xmlns:slic3rpe="http://schemas.slic3r.org/3mf/2017/06">
<metadata name="slic3rpe:Version3mf">1</metadata>
<metadata name="Title">wifi-card</metadata>
<resources><object id="1" type="model"><mesh><vertices>
${vs.join("\n")}
</vertices><triangles>
${ts.join("\n")}
</triangles></mesh></object></resources>
<build><item objectid="1"/></build>
</model>`;
    const cfg=`<?xml version="1.0" encoding="UTF-8"?>
<config>
<object id="1" instances_count="1">
<metadata type="object" key="name" value="wifi-card"/>
${vols.map(v=>`<volume firstid="${v.first}" lastid="${v.last}">
<metadata type="volume" key="name" value="${v.name}"/>
<metadata type="volume" key="volume_type" value="ModelPart"/>
<metadata type="volume" key="extruder" value="${v.fil}"/>
</volume>`).join("\n")}
</object>
</config>`;
    return [
      ["[Content_Types].xml",te.encode(`<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/><Default Extension="config" ContentType="text/xml"/></Types>`)],
      ["_rels/.rels",te.encode(`<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`)],
      ["3D/3dmodel.model",te.encode(model)],
      ["Metadata/Slic3r_PE_model.config",te.encode(cfg)]
    ];
  }
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  async function deflate(u){
    try{if(!("CompressionStream" in window))return null;
      const s=new Blob([u]).stream().pipeThrough(new CompressionStream("deflate-raw"));
      return new Uint8Array(await new Response(s).arrayBuffer());}catch(e){return null;}
  }
  async function zip(files){
    const te=new TextEncoder(),chunks=[],central=[];let off=0;
    for(const [name,data] of files){
      const nm=te.encode(name),crc=crc32(data),comp=await deflate(data),method=comp?8:0,body=comp||data;
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,method,true);
      lh.setUint16(12,33,true);lh.setUint32(14,crc,true);lh.setUint32(18,body.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);
      chunks.push(new Uint8Array(lh.buffer),nm,body);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,method,true);
      ch.setUint16(14,33,true);ch.setUint32(16,crc,true);ch.setUint32(20,body.length,true);ch.setUint32(24,data.length,true);
      ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
      central.push(new Uint8Array(ch.buffer),nm);
      off+=30+nm.length+body.length;
    }
    const cdSize=central.reduce((s,c)=>s+c.length,0),end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
    end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
    return new Blob([...chunks,...central,new Uint8Array(end.buffer)]);
  }
  function download(name,blob){
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }
  const fileBase=()=>"wifi-"+($("ssid").value||"card").replace(/[^\w\-]+/g,"_");
  const triCount=parts=>parts.reduce((s,p)=>s+p.tris.length/3,0).toLocaleString();
  const exportBtns=["dl3mf","dlZip","dlMono","dlStand"];
  async function run(label,fn){
    exportBtns.forEach(id=>$(id).disabled=true);
    $("status").textContent=label+"を作成中…";
    await new Promise(r=>setTimeout(r,30));
    try{$("status").textContent=await fn();}
    catch(e){console.error(e);$("status").textContent="作成に失敗しました: "+e.message;}
    finally{exportBtns.forEach(id=>$(id).disabled=false);}
  }
  $("dl3mf").onclick=()=>run("3MF",async()=>{
    const o=opts(),parts=await cardParts(o,o.finish);
    download(fileBase()+".3mf",await zip(model3mf(parts)));
    return `3MF を保存しました（${parts.length} パーツ、三角形 ${triCount(parts)} 個）。`;
  });
  $("dlZip").onclick=()=>run("色別STL",async()=>{
    const o=opts(),parts=await cardParts(o,o.finish);
    download(fileBase()+"_stl.zip",await zip(parts.map(p=>[`${fileBase()}_${p.fil}_${p.key}.stl`,stl([p])])));
    return `色別STLを保存しました（${parts.map(p=>p.key).join(" / ")}）。`;
  });
  $("dlMono").onclick=()=>run("色替え用STL",async()=>{
    const o=opts(),parts=await cardParts(o,"raised");
    download(fileBase()+"_colorchange.stl",new Blob([stl(parts)]));
    return `色替え用STLを保存しました。高さ ${o.T.toFixed(2)} mm でフィラメントを交換してください。`;
  });
  $("dlStand").onclick=()=>run("スタンドSTL",async()=>{
    const o=opts();download(fileBase()+"_stand.stl",new Blob([stl(standPart(o))]));
    return `スタンド2個を保存しました（溝幅 ${((o.finish==="flat"?o.T:o.T+o.h)+0.4).toFixed(1)} mm）。`;
  });

  /* ---------- 2D 書き出し・印刷 ---------- */
  $("dlSvg").onclick=()=>lastQr&&download(fileBase()+".svg",new Blob([qrSvg(lastQr)],{type:"image/svg+xml"}));
  $("dlPng").onclick=()=>{
    if(!lastQr)return;const n=lastQr.getModuleCount(),m=4,sc=16,size=(n+m*2)*sc;
    const cv=document.createElement("canvas");cv.width=cv.height=size;const g=cv.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,size,size);g.fillStyle="#000";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qrDark(lastQr,r,c))g.fillRect((c+m)*sc,(r+m)*sc,sc,sc);
    const z=qrClear(n);if(z){const k=(z.b-z.a)*sc,sz=Math.round(k*.84);g.drawImage(qrMark(sz),(m+z.a)*sc+Math.round((k-sz)/2),(m+z.a)*sc+Math.round((k-sz)/2));}
    cv.toBlob(b=>download(fileBase()+".png",b),"image/png");
  };
  $("copyPw").onclick=async()=>{
    try{await navigator.clipboard.writeText($("pw").value);$("copyPw").textContent="コピーしました";}
    catch{$("copyPw").textContent="コピーできませんでした";}
    setTimeout(()=>$("copyPw").textContent="パスワードをコピー",1500);
  };
  $("print").onclick=()=>window.print();
  $("regen").onclick=regen;

  /* ---------- ロゴ操作・リセット ---------- */
  $("logoFile").addEventListener("change",e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();r.onload=()=>{logoFromUpload=true;logoCleared=false;loadLogo(r.result);};r.readAsDataURL(file);
  });
  $("logoClear").onclick=()=>{logoFromUpload=false;logoCleared=true;$("logoFile").value="";loadLogo(null);};
  $("reset").onclick=()=>{store.clear();logoCleared=false;$("logoFile").value="";loadLogo(applySettings({}));};

  document.querySelectorAll('input[name=mode]').forEach(r=>r.addEventListener("change",()=>mode()==="manual"?render():regen()));
  ["len","noAmb","sym"].forEach(id=>$(id).addEventListener("input",()=>mode()!=="manual"?regen():render()));
  ["ssid","sec","hidden","pw","title","foot","showPw","lang","logoMode","logoLayer","frame","corner","qrLogo","cBase","cWhite","cA1","cA2",
   "finish","cw","ct","ch","res"].forEach(id=>$(id).addEventListener("input",render));

  const initialLogo=applySettings(store.get());
  regen();
  loadLogo(initialLogo);
})();
</script>
</body>
</html>
